. Feed them and bed them and they work faster.`,`The works ledger by the hall door says what the keep needs next.`]},{id:`maud-gate`,who:`maud`,when:[{quest:sg,step:`reach-wicket`}],lines:[`Stand where I can see you. ... That is a Warden's lantern. I have not seen one lit since I was a girl.`,`Open up! One leaf will do.`,`I'm Maud, reeve here, for what that is worth. We shut the gates when the dawn stopped coming.`,`The canker spreads from the heart-glade, and the old tower is choked with it. If you mean to go there, the road runs on west.`],then:[{do:`flag`,flag:`wicket:open`},{do:`step`,quest:sg,to:`see-briar`}]},{id:`maud-shut`,who:`maud`,when:[{noFlag:`wicket:open`}],lines:[`Who is that? ... We open to nobody we do not know. Not since the dawn stopped coming.`,`If you are what that cloak says you are, the old lamplighter at the keep will have work for you first.`]},{id:`maud-news`,who:`maud`,when:[{quest:sg,step:`tell-maud`}],lines:[`We saw the beacon take, and then the sky. Half the village was up on the wall, weeping like children.`,`The canker has gone grey and brittle on the palisade. It comes away in your hand.`,`Open both gates! And leave them open.`,`Whatever came to that light, Warden, you stood in front of it for us. Wicket will not forget.`],then:[{do:`finish`,quest:sg}]},{id:`maud-lamps-done`,who:`maud`,when:[{quest:`lamps-for-wicket`,is:`active`},{has:`rushlight-lantern`,count:3}],lines:[`Three, and well made. Tam! Fetch the ladder.`,`Here: my mother's salve, written out. Resin and herbs, warmed by a fire.`],then:[{do:`take`,item:`rushlight-lantern`,count:3},{do:`finish`,quest:`lamps-for-wicket`}]},{id:`maud-lamps-wait`,who:`maud`,when:[{quest:`lamps-for-wicket`,is:`active`}],lines:[`Three Rushlight Lanterns for the gateposts, when you have them to spare.`]},{id:`maud-lamps`,who:`maud`,when:[{flag:`wicket:open`},{quest:`lamps-for-wicket`,is:`unstarted`}],lines:[`Our gatepost lamps have been dark since the lamplighter left. Folk will not come home by a dark gate.`,`Three Rushlight Lanterns would do it. We have nothing to make them from, but you have a bench.`],then:[{do:`start`,quest:`lamps-for-wicket`}]},{id:`maud-after`,who:`maud`,when:[{quest:sg,is:`done`}],lines:[`The gates stay open now. Come in out of the dark whenever you like.`]},{id:`maud-road`,who:`maud`,when:[],lines:[`The road runs on west to the tower. Mind the briar: it does not like being cut.`]},{id:`ansel-rule`,who:`ansel`,when:[{quest:sg,is:`done`},{noFlag:`taught:crossbreed-rule`}],lines:[`I followed the light. I hope there is room; I have slept in worse than a roofless hall.`,`When your hatchery is built, remember this. The Order wrote it on the first page of the book.`,`When both parents have two elements and share exactly one, the egg may hold something with the two they do not share.`,`I have left blank pages in the bestiary for whatever comes of it.`],then:[{do:`flag`,flag:`taught:crossbreed-rule`}]},{id:`ansel-keep`,who:`ansel`,when:[{quest:sg,is:`done`}],lines:[`Blank pages itch. Two creatures, each of two elements, with one element in common: pair them and see.`,`The marsh road is the next one out. They say lights walk on the water there.`]},{id:`ansel-meet`,who:`ansel`,when:[{noFlag:`met:ansel`}],lines:[`A Warden! Then the bestiary gets written after all.`,`I'm Sister Ansel. I keep the Order's book, since the Order cannot.`,`Everything you meet goes in it, and everything you bind gets a fuller page.`,`A word of advice: the hour and the weather change what is abroad. The moths sleep by day. Some things show only in rain.`],then:[{do:`flag`,flag:`met:ansel`}]},{id:`ansel-wicket`,who:`ansel`,when:[],lines:[`A Rootsnout set to farm long enough grows into its tusks. The old Wardens swore by it.`,`And on a blood moon something large walks the heart-glade. I would not go looking. I would very much like a drawing.`]},{id:`garrick-done`,who:`garrick`,when:[{quest:`the-candle-thief`,is:`active`},{flag:`candle-thief:caught`},{partyHas:cg}],lines:[`That? A moth? ... Look at it eyeing the lantern. Well, I am blessed. It eats the tallow.`,`Here is resin for your trouble.`,`And my wife's trick with sleepmoss: two Raincaps and a twist of fibre. It puts anything to sleep.`],then:[{do:`give`,item:`resin`,count:10},{do:`finish`,quest:`the-candle-thief`}]},{id:`garrick-asleep`,who:`garrick`,when:[{quest:`the-candle-thief`,is:`active`},{noFlag:`candle-thief:caught`},{partyHas:cg}],lines:[`That one was asleep on a trunk when you took it, I would wager. I want the thing that comes in the night, caught at it.`]},{id:`garrick-wait`,who:`garrick`,when:[{quest:`the-candle-thief`,is:`active`}],lines:[`It comes at night, when the kiln is banked. Bind it and bring it here with you.`]},{id:`garrick-offer`,who:`garrick`,when:[{quest:`the-candle-thief`,is:`unstarted`}],lines:[`Something eats my candles. Not mice: it takes them down to the wick and leaves the dish clean.`,`It comes at night. I have sat up for it and seen nothing but moths.`,`You bind things. Bind whatever it is, at night, and show me.`],then:[{do:`start`,quest:`the-candle-thief`}]},{id:`garrick-after`,who:`garrick`,when:[],lines:[`I leave a stub out for the moths now. It keeps them off the good candles.`]},{id:`wenna-collect`,who:`wenna`,when:[{quest:`borrowed-tusks`,step:`collect`}],lines:[`There it is, and proud of itself. Those are the straightest furrows this field has had.`,`Twenty of grain and twenty of roots. Fair is fair.`],then:[{do:`returnLent`,quest:`borrowed-tusks`},{do:`give`,item:`grain`,count:20},{do:`give`,item:`roots`,count:20},{do:`finish`,quest:`borrowed-tusks`}]},{id:`wenna-working`,who:`wenna`,when:[{quest:`borrowed-tusks`,step:`wait`}],lines:[`It is out in the east strip, working. Come back when a full day has gone round.`]},{id:`wenna-lend`,who:`wenna`,when:[{quest:`borrowed-tusks`,step:`lend`},{lendable:`farming`,min:2}],lines:[`Which will you lend me? One full day, and it comes home fed.`],then:[{do:`lend`,quest:`borrowed-tusks`,skill:`farming`,min:2}]},{id:`wenna-none`,who:`wenna`,when:[{quest:`borrowed-tusks`,step:`lend`}],lines:[`It wants a real farmhand: Farming 2 or better. A Rootsnout would do. A pup that digs for fun would not.`]},{id:`wenna-offer`,who:`wenna`,when:[{quest:`borrowed-tusks`,is:`unstarted`}],lines:[`My ox walked into the Gloam last autumn. The field has not been turned since.`,`Lend me something that can farm, and I mean farm: a beast that knows a furrow.`,`One full day, and I will send you home with grain and roots.`],then:[{do:`start`,quest:`borrowed-tusks`}]},{id:`wenna-after`,who:`wenna`,when:[],lines:[`Sown and harrowed. Come spring there will be bread.`]},{id:`tam-tell`,who:`tam`,when:[{quest:`what-walks-at-night`,step:`tell`}],lines:[`Little ones? Walking? With stones on their backs? I KNEW it.`,`I am going to tell everyone. I am going to tell Reeve Maud twice.`],then:[{do:`finish`,quest:`what-walks-at-night`}]},{id:`tam-wait`,who:`tam`,when:[{quest:`what-walks-at-night`,is:`active`}],lines:[`It has to be a clear night, or you cannot see them. The circle is south-west of here, down the path that leaves the road past the village.`]},{id:`tam-offer`,who:`tam`,when:[{quest:`what-walks-at-night`,is:`unstarted`}],lines:[`Are you a real Warden? ... The stones in the circle move. At night. I saw them from the wall and nobody believes me.`,`It has to be a clear night or you cannot see. Will you look?`,`The circle is south-west of here, down the path that leaves the road past the village.`],then:[{do:`start`,quest:`what-walks-at-night`}]},{id:`tam-after`,who:`tam`,when:[],lines:[`I go and watch them from the path now. They do not mind.`]},{id:`nessa-done`,who:`nessa`,when:[{quest:`after-the-rain`,is:`active`},{has:`raincap`,count:5}],lines:[`Five, and fresh. Bless you.`,`Poultices, for your beasts.`,`And this is how a Kindling Draught is brewed: lamp oil and herbs, in a kitchen.`],then:[{do:`take`,item:`raincap`,count:5},{do:`give`,item:`poultice`,count:5},{do:`finish`,quest:`after-the-rain`}]},{id:`nessa-wait`,who:`nessa`,when:[{quest:`after-the-rain`,is:`active`}],lines:[`Only while it rains, mind. Look for the pale glint under the oaks.`]},{id:`nessa-offer`,who:`nessa`,when:[{quest:`after-the-rain`,is:`unstarted`}],lines:[`Raincaps. Little grey mushrooms that come up while the rain is falling and are gone an hour after.`,`My knees will not take me out in the wet any more. Five would see me through.`],then:[{do:`start`,quest:`after-the-rain`}]},{id:`nessa-after`,who:`nessa`,when:[],lines:[`They are drying over the fire. Smell that.`]}],ug=[`A page pinned under the brazier, in a Warden's hand:`,`"Four Vigils kept the four watches of the day: the Morrowhart the dawn, Noontide the noon, Evenpyre the dusk and Nighthush the night. The beacons carried their light across Aldermoor."`,`"Three of them broke with us and fled. I do not blame them. The Gloam is on them now, and they will not know a Warden."`,`"Light the beacon anyway. A Vigil knows its own hour, and will come to it. Stand your ground until it remembers."`];function dg(e,t){let n=e.quests[t];return n?n.done?`done`:`active`:`unstarted`}function fg(e,t){let n=e.quests[t],r=ef[t];return!n||n.done||!r?null:r.steps[Math.min(n.step,r.steps.length-1)]??null}function pg(e,t,n){return fg(e,t)?.id===n}function mg(e,t){return!ef[t]||e.quests[t]?!1:(e.quests[t]={step:0,done:!1},!0)}function hg(e,t,n){let r=e.quests[t],i=ef[t];if(!r||r.done||!i)return!1;let a=i.steps.findIndex(e=>e.id===n);return a<=r.step?!1:(r.step=a,!0)}function gg(e,t,n){let r=ef[n];if(!r)return!1;let i=e.quests[n]??{step:0,done:!1};return!i.done&&(i.step=r.steps.length-1,i.done=!0,e.quests[n]=i,t.add(`quest:${n}`),!0)}function _g(e,t){return q(e.species).work[t]??0}function vg(e,t,n){let r=Bf(e),i=[];for(let r of e.party)_g(r,t)<n||e.party.some(e=>e!==r&&e.hp>0)&&i.push(r);for(let a of e.keep)_g(a,t)>=n&&!r.has(a.uid)&&i.push(a);return i}function yg(e,t,n,r,i){let a=vg(e,r,i).find(e=>e.uid===n);return a?(e.party=e.party.filt
